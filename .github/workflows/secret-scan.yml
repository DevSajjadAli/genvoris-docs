# Secret / internal-content scanning gate.
#
# WHY THIS EXISTS
# A ~1 MB internal development transcript (transcript_content_utf8.txt) was
# committed to this PUBLIC repository. Deleting it in a later commit did not
# remove it -- git keeps every prior blob, so the file stayed retrievable from
# history with `git show <commit>^:transcript_content_utf8.txt` and disclosed
# the production database schema, backend secret names and their defaults,
# internal-only endpoints, and exact rate-limit thresholds.
#
# The history has been rewritten to purge it. This workflow is the control that
# stops the next one: it scans the full history on push/PR, so a reintroduced
# secret or transcript fails CI instead of shipping to a public site.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: the whole point is to catch a
          # secret that is buried in an earlier commit rather than the tip.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-files:
    name: forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gitleaks matches credential PATTERNS. The transcript that caused this
      # leak contained no live credentials at all -- it was architecture and
      # schema disclosure, which no secret scanner would have flagged. So this
      # second gate blocks the file SHAPES that carry that kind of content.
      - name: Block transcripts, build logs and env files
        run: |
          set -euo pipefail
          matches=$(git ls-files | grep -iE '(^|/)(transcript.*\.txt|build_output\.txt|.*\.env(\..*)?|.*credentials.*\.json)$' || true)
          if [ -n "$matches" ]; then
            echo "::error::Files matching internal/secret-bearing patterns are committed:"
            echo "$matches"
            exit 1
          fi
          echo "No forbidden files present."
